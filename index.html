<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Summary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <img src="illustration-hero.svg">

        <div class="card-content">
            <h1>Order Summary</h1>
            <p>
                You can now listen to millions of <br> songs, audiobooks, and podcasts on any device
                anywhere you like!
            </p>

            <div class="plan-row">
                <img class="icon" src="icon-music.svg">
                <div class="plan-details">
                    <span class="plan-name">Annual Plan</span>
                    <span class="plan-price">$59.99/year</span>
                </div>
                <a class="plan-change" href="#">Change</a>
            </div>

            <button class="proceed" type="button">Proceed to Payment</button>
            <button class="cancel" type="button">Cancel Order</button>
        </div>
    </div>
</body>
</html>
